# Example TLS-terminating reverse proxy for the LLM gateway.
# gateway.example.com -> API (data + control plane), console.example.com -> web.
# Certificates are expected in /etc/nginx/certs (e.g. issued by certbot).

upstream gateway_api { server api:8080; keepalive 64; }
upstream gateway_web { server web:3000; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

server {
  listen 80;
  server_name gateway.example.com console.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name gateway.example.com;
  ssl_certificate     /etc/nginx/certs/gateway.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/gateway.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 2m;

  # Metrics are for Prometheus on the internal network only.
  location = /metrics { deny all; }

  location / {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events: never buffer, allow long-lived streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name console.example.com;
  ssl_certificate     /etc/nginx/certs/console.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/console.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 2m;

  location / {
    proxy_pass http://gateway_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # playground streams through the console proxy
    proxy_read_timeout 15m;
  }
}
